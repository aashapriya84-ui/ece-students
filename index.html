<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECE 2024-28</title>
<style>
body{font-family:Arial;background:#eef2f7;margin:0;padding:0}
#loginBox{max-width:350px;margin:80px auto;background:white;padding:30px;border-radius:12px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.1)}
#mainBox{display:none;max-width:700px;margin:0 auto;background:white;min-height:100vh}
h1{background:#3498db;color:white;margin:0;padding:20px;text-align:center}
input{width:90%;padding:12px;margin:15px 0;border:1px solid #ccc;border-radius:6px}
button{background:#3498db;color:white;padding:12px;width:95%;border:none;border-radius:6px;font-size:16px;cursor:pointer}
table{width:100%;border-collapse:collapse}
td{padding:12px 10px;border-bottom:1px solid #eee;text-align:center;vertical-align:middle}
td:first-child{width:70px}
td img{width:55px;height:55px;border-radius:50%;object-fit:cover;border:2px solid #3498db}
.roll{font-weight:bold;color:#333}
.name{font-weight:bold;color:#2c3e50;text-transform:uppercase}
</style>
</head>
<body>
<div id="loginBox">
<h2>ECE Students Login</h2>
<p>Batch 2024-28</p>
<input type="password" id="pass" placeholder="Password: ece123">
<button onclick="login()">Login</button>
<p id="err" style="color:red"></p>
</div>

<div id="mainBox">
<h1>ECE - 2024-28 Students</h1>
<table id="table"></table>
</div>

<script>
function login(){
 if(document.getElementById('pass').value==='ece123'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('mainBox').style.display='block';
  show();
 }else{
  document.getElementById('err').innerText='Wrong password! ece123';
 }
}

const students=[
{roll:"403", name:"S ANUSHA", photo:"IMG2.jpeg"},
{roll:"404", name:"M DIVYA", photo:"IMG3.jpeg"},
{roll:"405", name:"G BHANU PRASAD", photo:"IMG4.jpeg"},
{roll:"406", name:"R SURES", photo:"IMG6.jpeg"},
{roll:"407", name:"T PRIYA", photo:"IMG7.jpeg"},
{roll:"408", name:"V ANIL", photo:"IMG8.jpeg"},
{roll:"412", name:"CH SIVASANKAR", photo:"SIV.jpeg"},
{roll:"413", name:"A SASI PRIYA", photo:"IM1.jpeg"},
{roll:"415", name:"G BHANU PRASAD", photo:"ME.jpeg"},
{roll:"416", name:"K MALLISWARI", photo:"IMG9.jpeg"},
{roll:"422", name:"A RAIAH", photo:"IMG10.jpeg"}
];

function show(){
 let h="";
 students.forEach(s=>{
  h+=`<tr><td><img src="${s.photo}"></td><td class="roll">${s.roll}</td><td class="name">${s.name}</td></tr>`;
 });
 document.getElementById('table').innerHTML=h;
}
</script>
</body>
</html>
