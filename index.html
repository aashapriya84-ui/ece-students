<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECE 2024-28 - Students</title>
<style>
body{font-family:Arial; text-align:center; background:#fff0f5; margin:0;}
#login{margin-top:100px;}
#login div{background:white; padding:30px; border-radius:15px; display:inline-block; box-shadow:0 0 10px #ccc;}
#login input{padding:10px; width:200px; margin:10px; border-radius:5px; border:1px solid #ccc;}
#login button{padding:10px; width:220px; background:#0099cc; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer;}
#gallery{display:none;}
h1{color:#d63384; padding:20px;}
.container{display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:20px;}
.card{border:3px solid #ffb6d9; border-radius:15px; padding:10px; width:200px; background:white;}
.card.boy{border-color:#6cb4ee;}
.card.girl{border-color:#ffb6d9;}
.card img{width:180px; height:220px; object-fit:cover; border-radius:10px; background:#eee;}
.card h3{color:#333; margin:5px;}
.you{border-color:#ff1493; border-width:5px;}
</style>
</head>
<body>

<div id="gallery">
<h1>ECE Students Management</h1>
<div class="container" id="container"></div>
</div>

<script>
// STUDENT DATA
const students = [
  {roll: 403, name: "S ANUSHA"},
  {roll: 404, name: "M DIVYA"},
  {roll: 405, name: "G BHANU PRASAD"},
  {roll: 406, name: "R SURESH"},
  {roll: 407, name: "T PRIYA"},
  {roll: 408, name: "V ANIL"},
  {roll: 412, name: "CH SIVASANKAR"},
  {roll: 413, name: "A SASI PRIYA"},
  {roll: 415, name: "G BHANU PRASAD"},
  {roll: 416, name: "K MALLISWARI"},
];

// BOYS NAMES LIST - Ikkada unna names anni boys ga treat chestundi
const boysKeywords = ["BHANU", "SURESH", "SIVA", "ANIL", "PRASAD", "RAVI", "SANKAR", "KUMAR", "BABU"];

function getGender(name) {
  let upper = name.toUpperCase();
  return boysKeywords.some(k => upper.includes(k)) ? "male" : "female";
}

function getImage(name, gender) {
  // Boys ki male avatar, Girls ki female avatar
  if (gender === "male") {
    return `https://api.dicebear.com/9.x/avataaars/svg?seed=${name}&backgroundColor=b6e3f4&top=shortFlat&facialHairProbability=30`;
  } else {
    return `https://api.dicebear.com/9.x/avataaars/svg?seed=${name}&backgroundColor=ffdfbf&top=longButNotTooLong`;
  }
}

// DISPLAY CARDS
const container = document.getElementById("container");
document.getElementById("gallery").style.display = "block";

students.forEach(s => {
  let gender = getGender(s.name);
  let img = getImage(s.name, gender);
  let div = document.createElement("div");
  div.className = `card ${gender === 'male' ? 'boy' : 'girl'}`;
  div.innerHTML = `
    <img src="${img}" alt="${s.name}">
    <h3>${s.roll}</h3>
    <h3>${s.name}</h3>
    <small>${gender === 'male' ? 'BOY' : 'GIRL'}</small>
  `;
  container.appendChild(div);
});
</script>
</body>
</html>
