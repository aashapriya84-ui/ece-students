<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECE 2024-28 - All Girls</title>
<style>
body{font-family:Arial; text-align:center; background:#fff0f5; margin:0;}
#login{margin-top:100px;}
#login div{background:white; padding:30px; border-radius:15px; display:inline-block; box-shadow:0 0 10px #ccc;}
#login input{padding:10px; width:200px; margin:10px; border-radius:5px; border:1px solid #ccc;}
#login button{padding:10px; width:220px; background:#0099cc; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer;}
#gallery{display:none;}
h1{color:#d63384; padding:20px;}
.container{display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:20px;}
.card{border:3px solid #ffb6d9; border-radius:15px; padding:10px; width:200px; background:white;}
.card img{width:180px; height:220px; object-fit:cover; border-radius:10px; background:#eee;}
.card h3{color:#333; margin:5px;}
.you{border-color:#ff1493; border-width:5px;}
</style>
</head>
<body>

<div id="login">
<div>
<h2>ECE Login</h2>
<input type="password" id="pass" placeholder="Password: ece123">
<br>
<button onclick="check()">Login</button>
<p id="msg" style="color:red;"></p>

</div>

<div id="gallery">
<h1>💃 ECE Students - All Girls 2024-28 💃</h1>
<div class="container">

<div class="card"><img src="402.jpg" onerror="this.src='https://via.placeholder.com/180x220?text=402'"><h3>402 - p ravi teja</h3></div>
<div class="card"><img src="403.jpg" onerror="this.src='https://via.placeholder.com/180x220?text=403'"><h3>403 - Anusha</h3></div>

<div class="card"><img src="406.jpg" onerror="this.src='https://via.placeholder.com/180x220?text=406'"><h3>406 - r suresh</h3></div>
<div class="card"><img src="408.jpg" onerror="this.src='https://via.placeholder.com/180x220?text=408'"><h3>408 - v anil</h3></div>
<div class="card"><img src="412.jpg" onerror="this.src='https://via.placeholder.com/180x220?text=412'"><h3>412 - ch siva sankar</h3></div>
<div class="card you"><img src="413.jpg" onerror="this.src='https://via.placeholder.com/180x220?text=413'"><h3>413 - Sasi Priya </h3></div>

</div>
</div>

<script>
function check(){
let p=document.getElementById('pass').value;
if(p==='ece123'){
document.getElementById('login').style.display='none';
document.getElementById('gallery').style.display='block';
}else{
document.getElementById('msg').innerText='Wrong Password! Try ece123';
}
}
</script>

</body>
</html>
