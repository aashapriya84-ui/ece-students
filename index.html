<!DOCTYPE html>
<html>
<head><title>ECE Students</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:Arial;background:#f0f2f5;margin:0}header{background:#6c5ce7;color:#fff;padding:15px;text-align:center}.card{background:#fff;border-radius:10px;padding:10px;margin:10px;width:200px;display:inline-block;text-align:center;box-shadow:0 2px 6px #0002}.grid{display:flex;flex-wrap:wrap;justify-content:center}</style>
</head>
<body>
<header><h2>ECE Students - A6 ERP</h2><p>Admin: Admin / 123</p></header>
<div style="text-align:center;padding:10px"><input id="s" placeholder="Search" onkeyup="search()" style="padding:8px;width:250px"></div>
<div id="grid" class="grid"></div>
<script>
let students=[
{name:"S ANUSHA",roll:"403",marks:88,fee:"Paid"},
{name:"M DIVYA",roll:"404",marks:76,fee:"Paid"},
{name:"G BHANU PRASAD",roll:"405",marks:65,fee:"Pending"},
{name:"R SURESH",roll:"406",marks:42,fee:"Paid"},
{name:"V ANIL",roll:"408",marks:90,fee:"Paid"},
{name:"A SASI PRIYA",roll:"413",marks:95,fee:"Pending"}
];
function render(list){
let g=document.getElementById('grid');g.innerHTML="";
list.forEach(s=>{
g.innerHTML+=`<div class="card"><div style="background:#dfe6e9;height:120px;display:flex;align-items:center;justify-content:center;font-size:40px;border-radius:8px">${s.name[0]}</div><h4>${s.roll} - ${s.name}</h4><p>${s.marks} Marks<br>Fee: ${s.fee}</p><button onclick="alert('Father details for ${s.name}')">Parents</button> <button onclick="alert('ID Card ${s.name}')">ID Card</button><br><button onclick="upload(this)">📷 Add Photo</button></div>`;
});
}
function search(){let q=document.getElementById('s').value.toLowerCase();render(students.filter(x=>x.name.toLowerCase().includes(q)));}
function upload(btn){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=e=>{let r=new FileReader();r.onload=ev=>{btn.parentElement.querySelector('div').innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:8px">`;};r.readAsDataURL(e.target.files[0]);};i.click();}
render(students);
</script>
</body>
</html>
