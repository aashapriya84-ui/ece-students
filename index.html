<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECE Students - A6 ERP</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0}
header{background:#6c5ce7;color:#fff;padding:15px;text-align:center}
.grid{display:flex;flex-wrap:wrap;justify-content:center;padding:10px;gap:12px}
.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 4px 10px rgba(0,0,0,.1);text-align:center;width:210px}
.card img,.letter-box{width:100%;height:160px;border-radius:10px;object-fit:cover;background:#dfe6e9;display:flex;align-items:center;justify-content:center;font-size:45px;font-weight:bold}
.btn{border:none;padding:6px 10px;border-radius:6px;color:#fff;cursor:pointer;margin:3px;font-size:12px}
.login-box{max-width:360px;margin:60px auto;background:#fff;padding:20px;border-radius:12px}
input,select{width:100%;padding:9px;margin:6px 0;border-radius:7px;border:1px solid #ccc;box-sizing:border-box}
.top-bar{padding:10px;text-align:center;background:#fff}
</style></head>
<body>
<header><h2>ECE Students - A6 ERP</h2></header>
<div id="login" class="login-box">
<h3>Login</h3>
<select id="role"><option>Admin</option><option>Student</option><option>Parent</option></select>
<input id="user" placeholder="Admin / Roll">
<input id="pass" type="password" placeholder="Password 123">
<button class="btn" style="background:#6c5ce7;width:100%;padding:10px" onclick="doLogin()">Login</button>
<p style="font-size:12px;text-align:center">Admin: Admin / 123</p>
</div>
<div id="main" style="display:none">
<div class="top-bar">
<input id="search" placeholder="Search" onkeyup="doSearch()" style="max-width:280px;display:inline-block">
<button class="btn" style="background:#d63031" onclick="location.reload()">Logout</button>
<div id="adminPanel" style="display:none;max-width:700px;margin:10px auto;background:#f8f9fa;padding:12px;border-radius:10px">
<input id="newName" placeholder="Name"><input id="newRoll" placeholder="Roll"><input id="newFather" placeholder="Father"><input id="newMother" placeholder="Mother"><input id="newMarks" type="number" placeholder="Marks"><select id="newFee"><option>Paid</option><option>Pending</option></select>
<button class="btn" style="background:#00b894;width:100%;padding:10px" onclick="addStudent()">Add Student</button>
</div></div>
<div id="grid" class="grid"></div>
</div>
<script>
let saved=localStorage.getItem('ece_data_v2');
let students=saved?JSON.parse(saved):[
{name:"S ANUSHA",roll:"403",father:"S Ramesh",mother:"S Lakshmi",marks:88,fee:"Paid",photo:""},
{name:"M DIVYA",roll:"404",father:"M Prasad",mother:"M Sita",marks:76,fee:"Paid",photo:""},
{name:"G BHANU PRASAD",roll:"405",father:"G Srinu",mother:"G Latha",marks:65,fee:"Pending",photo:""},
{name:"R SURESH",roll:"406",father:"R Kumar",mother:"R Devi",marks:42,fee:"Paid",photo:""},
{name:"V ANIL",roll:"408",father:"V Murthy",mother:"V Sunita",marks:90,fee:"Paid",photo:""},
{name:"A SASI PRIYA",roll:"413",father:"A Kumar",mother:"A Devi",marks:95,fee:"Pending",photo:""}
];
function doLogin(){let p=document.getElementById('pass').value;if(p!=='123'){alert('Wrong pass');return;}let r=document.getElementById('role').value;if(r==='Admin')document.getElementById('adminPanel').style.display='block';document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';render();}
function getGrade(m){return m>=85?'A':m>=70?'B':m>=50?'C':'D';}
function render(list=students){let g=document.getElementById('grid');g.innerHTML="";list.forEach((s,i)=>{let ph=s.photo?`<img src="${s.photo}">`:`<div class="letter-box">${s.name.trim()[0]}</div>`;g.innerHTML+=`<div class="card">${ph}<h4>${s.roll} - ${s.name}</h4><p style="font-size:13px">${s.marks} Marks | ${getGrade(s.marks)}<br><b style="color:${s.fee==='Paid'?'green':'red'}">${s.fee}</b></p><button class="btn" style="background:#0984e3" onclick="openDetails(${i})">Parents</button><button class="btn" style="background:#e84393" onclick="makeID(${i})">ID Card</button><br><button class="btn" style="background:#fdcb6e;color:#000" onclick="uploadPhoto(${i})">📷 Photo Add</button></div>`;});localStorage.setItem('ece_data_v2',JSON.stringify(students));}
function openDetails(i){let s=students[i];alert(s.name+"\nRoll: "+s.roll+"\nFather: "+s.father+"\nMother: "+s.mother+"\nMarks: "+s.marks+"\nFee: "+s.fee);}
function makeID(i){let s=students[i];let w=window.open('','','width=360,height=500');w.document.write(`<div style="border:2px solid #000;padding:20px;text-align:center"><h3>ECE ID</h3><h2>${s.name}</h2><p>Roll: ${s.roll}<br>Father: ${s.father}</p></div>`);}
function uploadPhoto(i){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{let rd=new FileReader();rd.onload=ev=>{students[i].photo=ev.target.result;render();alert('Photo added!');};rd.readAsDataURL(e.target.files[0]);};inp.click();}
function addStudent(){let n=document.getElementById('newName').value,r=document.getElementById('newRoll').value;if(!n||!r)return alert('Name Roll kavali');students.push({name:n.toUpperCase(),roll:r,father:document.getElementById('newFather').value,mother:document.getElementById('newMother').value,marks:parseInt(document.getElementById('newMarks').value)||0,fee:document.getElementById('newFee').value,photo:""});render();}
function doSearch(){let q=document.getElementById('search').value.toLowerCase();render(students.filter(s=>s.name.toLowerCase().includes(q)||s.roll.includes(q)));}
render();
</script></body></html>
