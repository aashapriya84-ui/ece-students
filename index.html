<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ECE 2024-28</title><style>body{font-family:Arial;background:#f0f2f5;margin:0;padding:20px}h1{text-align:center;color:#2c3e50}#loginBox{max-width:350px;margin:60px auto;background:white;padding:30px;border-radius:12px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.1)}#mainBox{display:none}input{width:90%;padding:12px;margin:10px 0;border-radius:6px;border:1px solid #ccc}button{background:#3498db;color:white;padding:12px;border:none;border-radius:6px;width:95%;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;margin-top:20px}.card{background:white;padding:10px;border-radius:10px;text-align:center}.card img{width:100%;height:150px;object-fit:cover;border-radius:8px;background:#ddd}.roll{font-weight:bold}.name{font-size:13px;color:#555}</style></head><body><div id="loginBox"><h2>ECE Login</h2><input type="password" id="pass" placeholder="Password: ece123"><button onclick="login()">Login</button><p id="err" style="color:red"></p></div><div id="mainBox"><h1>ECE 2024-28 Students</h1><div class="grid" id="grid"></div></div><script>function login(){if(document.getElementById('pass').value==='ece123'){document.getElementById('loginBox').style.display='none';document.getElementById('mainBox').style.display='block';show();}else{document.getElementById('err').innerText='Wrong password! ece123 type chey';}}const students=[{roll:"413 SASI",photo:"IM1.jpeg"},{roll:"401",photo:"IMG2.jpeg"},{roll:"402",photo:"IMG3.jpeg"},{roll:"403",photo:"IMG4.jpeg"},{roll:"404",photo:"IMG6.jpeg"},{roll:"405",photo:"IMG7.jpeg"},{roll:"406",photo:"IMG8.jpeg"},{roll:"407",photo:"IMG9.jpeg"},{roll:"408",photo:"IMG10.jpeg"},{roll:"415 ME",photo:"ME.jpeg"},{roll:"412 SIVASANKAR",photo:"SIV.jpeg"}];function show(){let h="";students.forEach(s=>{h+=`<div class="card"><img src="${s.photo}"><div class="roll">${s.roll}</div></div>`});document.getElementById('grid').innerHTML=h;}</script></body></html>
