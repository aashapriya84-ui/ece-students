<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECE Students Management</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;margin:0;padding:20px}
.login-box{max-width:350px;margin:80px auto;background:white;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.2);text-align:center}
.main-box{max-width:1000px;margin:0 auto;background:white;padding:20px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.2);display:none}
input,button{padding:10px;margin:5px;border-radius:8px;border:1px solid #ccc}
button{background:#667eea;color:white;border:none;cursor:pointer;font-weight:bold}
button:hover{background:#5a67d8}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#667eea;color:white}
.top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>

<div id="loginDiv" class="login-box">
<h2>🔐 ECE Login</h2>
<input type="text" id="uname" placeholder="Username"><br>
<input type="password" id="pword" placeholder="Password"><br>
<button onclick="doLogin()">Login</button>
<p style="font-size:12px;color:gray;margin-top:10px">User: admin | Pass: 1234</p>
</div>

<div id="mainDiv" class="main-box">
<div class="top-bar">
<h2>🎓 ECE Students - 2024</h2>
<button onclick="doLogout()" style="background:#ff4757">Logout</button>
</div>

<input type="text" id="search" placeholder="🔍 Search by Name or Roll..." onkeyup="searchTable()" style="width:70%">

<table id="studentTable">
<thead>
<tr><th>Roll No</th><th>Student Name</th><th>Action</th></tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>
const defaultStudents = [
["413","A SASI PRIYA"],["412","CH SIVA SANKAR"],["415","G BHANU PRASAD"],["416","K MALLISWARI"],
["401","B LAKSHMI"],["402","P RAVI TEJA"],["403","S ANUSHA"],["404","M DIVYA"],
["405","K KIRAN"],["406","R SURESH"],["407","T PRIYA"],["408","V ANIL"]
];

let students = JSON.parse(localStorage.getItem("eceData")) || defaultStudents;

function render(){
let tbody=document.getElementById("tbody");
tbody.innerHTML="";
students.forEach((s,i)=>{
tbody.innerHTML+=`<tr><td>${s[0]}</td><td>${s[1]}</td><td><button onclick="editName(${i})">Edit</button> <button onclick="del(${i})" style="background:#ff4757">Delete</button></td></tr>`;
});
localStorage.setItem("eceData",JSON.stringify(students));
}

function doLogin(){
if(document.getElementById("uname").value=="admin" && document.getElementById("pword").value=="1234"){
document.getElementById("loginDiv").style.display="none";
document.getElementById("mainDiv").style.display="block";
render();
}else{alert("Wrong! Use admin / 1234");}
}

function doLogout(){
document.getElementById("mainDiv").style.display="none";
document.getElementById("loginDiv").style.display="block";
}

function searchTable(){
let f=document.getElementById("search").value.toLowerCase();
let tr=document.getElementById("tbody").getElementsByTagName("tr");
for(let i=0;i<tr.length;i++){
tr[i].style.display=tr[i].innerText.toLowerCase().includes(f)?"":"none";
}
}

function editName(i){
let n=prompt("New Name:",students[i][1]);
if(n){students[i][1]=n.toUpperCase();render();}
}
function del(i){
if(confirm("Delete?")){students.splice(i,1);render();}
}
</script>
</body>
</html>
