<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECE Students - A6 ERP</title>
<style>
*{box-sizing:border-box}body{font-family:'Segoe UI',Arial;background:#f8f9ff;margin:0}
header{background:#fff;padding:18px 15px;text-align:center;box-shadow:0 2px 8px #0001;position:sticky;top:0;z-index:10}
header h2{margin:0;color:#6c5ce7;letter-spacing:2px}
.search-wrap{display:flex;justify-content:center;padding:18px}
.search-wrap input{width:360px;max-width:90%;padding:12px 18px;border-radius:25px;border:2px solid #e0c3c3;outline:none;font-size:14px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;padding:10px 20px 40px}
.card{background:#fff;width:215px;border-radius:14px;padding:0 0 12px;box-shadow:0 4px 15px rgba(0,0,0,.08);cursor:pointer;transition:.2s;overflow:hidden;border-top:4px solid #e84393}
.card:nth-child(even){border-top-color:#0984e3}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 22px rgba(0,0,0,.15)}
.card img{width:100%;height:195px;object-fit:cover;background:#f1f2f6}
.card .info{padding:10px 8px 0;text-align:center}
.card .info b{font-size:13px;display:block}.card .info span{font-size:11px;color:#0984e3}
#loginBox{max-width:360px;margin:70px auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 6px 20px #0001;text-align:center}
#loginBox input,#loginBox select{width:100%;padding:10px;margin:7px 0;border-radius:8px;border:1px solid #ccc}
.btn{border:none;padding:10px 14px;border-radius:8px;color:#fff;cursor:pointer;background:#6c5ce7;width:100%}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:99}
.modal-content{background:#fff;width:360px;max-width:90%;border-radius:14px;padding:18px;position:relative}
.close{position:absolute;right:12px;top:8px;font-size:22px;cursor:pointer}
.badge{padding:3px 8px;border-radius:10px;font-size:11px;color:#fff}
</style>
</head>
<body>
<header><h2>ECE STUDENTS MANAGEMENT</h2><small>Login: Admin / 123</small></header>

<div id="loginBox">
<h3>Login</h3>
<select id="role"><option>Admin</option><option>Student</option><option>Parent</option></select>
<input id="user" placeholder="Username / Roll No">
<input id="pass" type="password" placeholder="Password (123)">
<button class="btn" onclick="doLogin()">Login</button>
<p style="font-size:12px">Admin: Admin / 123 | Student: Roll No / 123</p>
</div>

<div id="main" style="display:none">
<div class="search-wrap"><input id="q" placeholder="Search by Name or Roll No... Eg: 403 or Anusha" onkeyup="doSearch()"></div>
<div style="text-align:center;margin-bottom:10px;display:none" id="adminPanel"><button class="btn" style="width:auto;background:#00b894" onclick="addNew()">+ Add New Student</button> <button class="btn" style="width:auto;background:#d63031" onclick="location.reload()">Logout</button></div>
<div id="grid" class="grid"></div>
</div>

<div id="myModal" class="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-content">
<span class="close" onclick="closeModal()">&times;</span>
<div id="modalBody"></div>
</div>
</div>

<script>
let students=[
{name:"S ANUSHA",roll:"403",father:"S Ramesh",mother:"S Lakshmi",marks:88,fee:"Paid",photo:"girl1.jpg",phone:"9XXXX XXXXX"},
{name:"M DIVYA",roll:"404",father:"M Prasad",mother:"M Sita",marks:76,fee:"Paid",photo:"girl2.jpg",phone:"9XXXX XXXXX"},
{name:"G BHANU PRASAD",roll:"405",father:"G Srinu",mother:"G Latha",marks:82,fee:"Paid",photo:"boy1.jpg",phone:"9XXXX XXXXX"},
{name:"R SURESH",roll:"406",father:"R Kumar",mother:"R Devi",marks:68,fee:"Paid",photo:"boy2.jpg",phone:"9XXXX XXXXX"},
{name:"V ANIL",roll:"408",father:"V Murthy",mother:"V Sunita",marks:90,fee:"Paid",photo:"boy3.jpg",phone:"9XXXX XXXXX"},
{name:"CH SIVA SANKAR",roll:"412",father:"CH Prasad",mother:"CH Lakshmi",marks:79,fee:"Pending",photo:"boy1.jpg",phone:"9XXXX XXXXX"},
{name:"A SASI PRIYA",roll:"413",father:"A Kumar",mother:"A Devi",marks:95,fee:"Pending",photo:"girl4.jpg",phone:"9XXXX XXXXX"},
{name:"TEJA",roll:"401",father:"Teja Father",mother:"Teja Mother",marks:88,fee:"Paid",photo:"TEJA.jpeg",phone:"9XXXX XXXXX"}
];

function doLogin(){
if(document.getElementById('pass').value!='123') return alert('Password 123 pettali ra');
document.getElementById('loginBox').style.display='none';
document.getElementById('main').style.display='block';
if(document.getElementById('role').value=='Admin') document.getElementById('adminPanel').style.display='block';
render();
}
function getGrade(m){return m>=85?'A':m>=70?'B':m>=50?'C':'D';}
function render(list=students){
let g=document.getElementById('grid');g.innerHTML='';
list.forEach((s,i)=>{
let img=`<img src="${s.photo}" onerror="this.src='https://i.pravatar.cc/300?img=${(parseInt(s.roll)%70)+1}'">`;
g.innerHTML+=`<div class="card" onclick="openDetails(${students.indexOf(s)})">${img}<div class="info"><b>${s.roll}<br>${s.name}</b><span>Click for Details</span></div></div>`;
});
}
function openDetails(i){
let s=students[i];
let grade=getGrade(s.marks);
document.getElementById('modalBody').innerHTML=`
<img src="${s.photo}" onerror="this.src='https://i.pravatar.cc/300?img=5'" style="width:100%;height:200px;object-fit:cover;border-radius:10px">
<h3 style="margin:10px 0 4px">${s.name} - ${s.roll}</h3>
<p style="margin:0;font-size:13px;line-height:1.7">
👨 <b>Father:</b> ${s.father}<br>
👩 <b>Mother:</b> ${s.mother}<br>
📚 <b>Marks:</b> ${s.marks} | Grade: <span class="badge" style="background:${grade=='A'?'#00b894':grade=='B'?'#0984e3':grade=='C'?'#fdcb6e':'#d63031'}">${grade}</span><br>
💰 <b>Fee:</b> <span style="color:${s.fee=='Paid'?'green':'red'};font-weight:bold">${s.fee}</span><br>
📞 <b>Phone:</b> ${s.phone}
</p>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn" style="background:#0984e3" onclick="printID(${i})">🪪 ID Card Print</button>
<button class="btn" style="background:#e84393" onclick="changePhoto(${i})">📷 Change Photo</button>
</div>`;
document.getElementById('myModal').style.display='flex';
}
function closeModal(){document.getElementById('myModal').style.display='none';}
function printID(i){
let s=students[i];
let w=window.open('','','width=380,height=550');
w.document.write(`<div style="font-family:Arial;border:3px solid #6c5ce7;padding:20px;text-align:center;border-radius:12px"><h3>ECE ID CARD</h3><img src="${s.photo}" style="width:130px;height:130px;border-radius:50%;object-fit:cover"><h2>${s.name}</h2><p>Roll: ${s.roll}<br>Father: ${s.father}<br>Grade: ${getGrade(s.marks)}<br>Fee: ${s.fee}</p><hr><small>A6 ERP - ECE Dept</small></div>`);
w.print();
}
function changePhoto(i){
let inp=document.createElement('input');inp.type='file';inp.accept='image/*';
inp.onchange=e=>{
let r=new FileReader();r.onload=ev=>{students[i].photo=ev.target.result;render();openDetails(i);};r.readAsDataURL(e.target.files[0]);
};inp.click();
}
function addNew(){
let n=prompt('Student Name?');if(!n) return;
let r=prompt('Roll No?');if(!r) return;
students.push({name:n.toUpperCase(),roll:r,father:"Father",mother:"Mother",marks:75,fee:"Paid",photo:"",phone:"9XXXX XXXXX"});
render();alert('Added ra Sasi!');
}
function doSearch(){
let q=document.getElementById('q').value.toLowerCase();
render(students.filter(s=>s.name.toLowerCase().includes(q)||s.roll.includes(q)));
}
</script>
</body>
</html>
