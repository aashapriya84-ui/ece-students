<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECE Students - A6 ERP</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f2f5;margin:0}
header{background:#6c5ce7;color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.grid{display:flex;flex-wrap:wrap;justify-content:center;padding:10px;gap:12px}
.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 4px 10px rgba(0,0,0,.1);text-align:center;width:210px}
.card img,.letter-box{width:100%;height:160px;border-radius:10px;object-fit:cover;background:#dfe6e9;display:flex;align-items:center;justify-content:center;font-size:45px;font-weight:bold}
.btn{border:none;padding:6px 10px;border-radius:6px;color:#fff;cursor:pointer;margin:3px;font-size:12px}
.login-box{max-width:360px;margin:60px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
input,select{width:100%;padding:9px;margin:6px 0;border-radius:7px;border:1px solid #ccc;box-sizing:border-box}
.top-bar{padding:10px;text-align:center;background:#fff;margin-bottom:5px}
</style>
</head>
<body>
<header><h2 style="margin:0">ECE Students Management - A6 ERP</h2></header>

<div id="login" class="login-box">
<h3 style="text-align:center">Login</h3>
<select id="role"><option>Admin</option><option>Student</option><option>Parent</option></select>
<input id="user" placeholder="Admin / Roll No (403)">
<input id="pass" type="password" placeholder="Password 123">
<button class="btn" style="background:#6c5ce7;width:100%;padding:10px;margin-top:10px" onclick="doLogin()">Login</button>
<p style="font-size:12px;text-align:center;color:#636e72">Admin: Admin / 123<br>Student: Roll No / 123</p>
</div>

<div id="main" style="display:none">
<div class="top-bar">
<input id="search" placeholder="Search Name / Roll No" onkeyup="doSearch()" style="max-width:280px;display:inline-block">
<button class="btn" style="background:#d63031;padding:9px 15px" onclick="logout()">Logout</button>
<div id="adminPanel" style="display:none;max-width:700px;margin:15px auto;background:#f8f9fa;padding:12px;border-radius:10px">
<h4>Add New Student</h4>
<input id="newName" placeholder="Name (ex: S ANUSHA)">
<input id="newRoll" placeholder="Roll No (ex: 403)">
<input id="newFather" placeholder="Father Name">
<input id="newMother" placeholder="Mother Name">
<input id="newMarks" placeholder="Marks" type="number">
<select id="newFee"><option>Paid</option><option>Pending</option></select>
<input id="newPhotoFile" type="file" accept="image/*">
<button class="btn" style="background:#00b894;width:100%;padding:10px" onclick="addStudent()">Add Student</button>
</div>
</div>
<div id="grid" class="grid"></div>
</div>

<script>
let students=JSON.parse(localStorage.getItem('ece_data_v2'))||'null')||[
{name:"S ANUSHA",roll:"403",father:"S Ramesh",mother:"S Lakshmi",marks:88,fee:"Paid",photo:""},
{name:"M DIVYA",roll:"404",father:"M Prasad",mother:"M Sita",marks:76,fee:"Paid",photo:""},
{name:"G BHANU PRASAD",roll:"405",father:"G Srinu",mother:"G Latha",marks:65,fee:"Pending",photo:""},
{name:"R SURESH",roll:"406",father:"R Kumar",mother:"R Devi",marks:42,fee:"Paid",photo:""},
{name:"T PRIYA",roll:"407",father:"T Ravi",mother:"T Anu",marks:35,fee:"Pending",photo:""},
{name:"V ANIL",roll:"408",father:"V Murthy",mother:"V Sunita",marks:90,fee:"Paid",photo:""},
{name:"CH SIVASANKAR",roll:"412",father:"CH Rao",mother:"CH Latha",marks:82,fee:"Paid",photo:""},
{name:"A SASI PRIYA",roll:"413",father:"A Kumar",mother:"A Devi",marks:95,fee:"Pending",photo:""},
{name:"K LAKSHMI",roll:"414",father:"K Prasad",mother:"K Sita",marks:78,fee:"Paid",photo:""},
{name:"P RAVI KUMAR",roll:"415",father:"P Srinu",mother:"P Lakshmi",marks:55,fee:"Paid",photo:""}
];

function doLogin(){
let r=document.getElementById('role').value,u=document.getElementById('user').value,p=document.getElementById('pass').value;
if(r==='Admin'&&u.toLowerCase()==='admin'&&p==='123'){document.getElementById('adminPanel').style.display='block';}
else if(p!=='123'){alert('Password wrong! Use 123');return;}
else if(r!=='Admin'&&!u){alert('Roll No enter chey');return;}
document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';render();
}
function logout(){location.reload();}
function getGrade(m){return m>=85?'A':m>=70?'B':m>=50?'C':'D';}
function render(list=students){
let g=document.getElementById('grid');g.innerHTML="";
list.forEach((s,i)=>{
let photoHTML=s.photo?`<img src="${s.photo}">`:`<div class="letter-box">${s.name.trim()[0]}</div>`;
g.innerHTML+=`<div class="card">${photoHTML}
<h4 style="margin:8px 0">${s.roll} - ${s.name}</h4>
<p style="font-size:13px;margin:4px 0">📚 ${s.marks} Marks | ${getGrade(s.marks)}<br>💰 Fee: <b style="color:${s.fee==='Paid'?'green':'red'}">${s.fee}</b></p>
<button class="btn" style="background:#0984e3" onclick="openDetails(${i})">Parents Details</button>
<button class="btn" style="background:#e84393" onclick="makeID(${i})">ID Card</button>
<br><button class="btn" style="background:#fdcb6e;color:#000" onclick="uploadPhoto(${i})">📷 Photo Add / Change</button>
</div>`;
});
localStorage.setItem('ece_data_v2',JSON.stringify(students));
}
function openDetails(i){let s=students[i];alert(`Student: ${s.name}\nRoll: ${s.roll}\nFather: ${s.father}\nMother: ${s.mother}\nMarks: ${s.marks} (${getGrade(s.marks)})\nFee: ${s.fee}`);}
function makeID(i){let s=students[i];let w=window.open('','','width=360,height=520');w.document.write(`<div style="border:2px solid #000;padding:20px;text-align:center;font-family:Arial"><h3>ECE ID CARD</h3>${s.photo?`<img src="${s.photo}" style="width:120px;height:120px;border-radius:50%">`:`<h1>${s.name[0]}</h1>`}<h2>${s.name}</h2><p>Roll: ${s.roll}<br>Father: ${s.father}<br>Grade: ${getGrade(s.marks)}<br>Fee: ${s.fee}</p><hr><small>ECE Department</small></div>`);}
function uploadPhoto(i){
let input=document.createElement('input');input.type='file';input.accept='image/*';
input.onchange=e=>{
let reader=new FileReader();
reader.onload=ev=>{students[i].photo=ev.target.result;render();alert('Photo added ra Sasi! ✅');};
reader.readAsDataURL(e.target.files[0]);
};
input.click();
}
function addStudent(){
let n=document.getElementById('newName').value,r=document.getElementById('newRoll').value,f=document.getElementById('newFather').value,m=document.getElementById('newMother').value,mk=parseInt(document.getElementById('newMarks').value)||0,fee=document.getElementById('newFee').value;
let fileInput=document.getElementById('newPhotoFile');
if(!n||!r)return alert('Name & Roll kavali ra');
let add=(photoData)=>{
students.push({name:n.toUpperCase(),roll:r,father:f,mother:m,marks:mk,fee:fee,photo:photoData||""});render();document.getElementById('newName').value="";document.getElementById('newRoll').value="";alert('Student added!');};
if(fileInput.files[0]){let rd=new FileReader();rd.onload=ev=>add(ev.target.result);rd.readAsDataURL(fileInput.files[0]);}else{add("");}
}
function doSearch(){let q=document.getElementById('search').value.toLowerCase();render(students.filter(s=>s.name.toLowerCase().includes(q)||s.roll.includes(q)));}
render();
</script>
</body>
</html>
